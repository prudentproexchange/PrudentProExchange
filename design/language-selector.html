<!-- language-selector.html -->
<div class="lang-selector">
  <button class="lang-btn" id="current-language" aria-haspopup="true" aria-expanded="false">
    <img src="flags/gb.png" alt="English"> <span>EN</span> ▼
  </button>
  <ul class="lang-list" id="lang-list" role="menu" aria-label="Select Language">
    <!-- Languages (same as provided, 110 total) -->
    <li data-lang="af" data-flag="za.png" role="menuitem">
      <img src="flags/za.png" alt="Afrikaans"> Afrikaans
    </li>
    <li data-lang="sq" data-flag="al.png" role="menuitem">
      <img src="flags/al.png" alt="Shqip"> Shqip
    </li>
    <!-- ... Include all 110 languages from the previous code ... -->
    <li data-lang="yo" data-flag="ng.png" role="menuitem">
      <img src="flags/ng.png" alt="Yorùbá"> Yorùbá
    </li>
    <li data-lang="zu" data-flag="za.png" role="menuitem">
      <img src="flags/za.png" alt="isiZulu"> isiZulu
    </li>
  </ul>
</div>
