<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Debug Test Apply</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #f0f2f5; }
    form { max-width: 400px; margin: auto; background: #fff;
           padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);}
    label { display: block; margin-bottom: 1rem; }
    input, select { width: 100%; padding: .5rem; margin-top: .25rem;
                    border: 1px solid #ccc; border-radius: 4px; }
    button { margin-top: 1rem; padding: .75rem 1.5rem;
             background: #0069d9; color: #fff; border: none;
             border-radius: 4px; cursor: pointer; }
    button:disabled { background: #999; }
    .error { color: #b00020; margin-top: .5rem; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h2 style="text-align:center;">🔧 Debug Test Sign‐Up</h2>
  <form id="testForm">
    <label>First Name <input name="first_name" required /></label>
    <label>Last Name  <input name="last_name" required /></label>
    <label>Email      <input type="email" name="email" required /></label>
    <label>Username   <input name="username" required /></label>
    <label>Country    <select name="country" required>
                     <option value="">-- choose --</option>
                     <option value="GB">UK</option>
                     <option value="US">USA</option>
                     <option value="NG">Nigeria</option>
                   </select></label>
    <label>Referral   <input name="referral_code" /></label>
    <label>Password   <input type="password" name="password" required /></label>
    <label>Confirm    <input type="password" name="confirm_password" required /></label>
    <label>Photo      <input type="file" name="photo" accept="image/*" /></label>
    <button id="submitBtn">Create Account</button>
    <p class="error" id="errorMsg"></p>
  </form>

  <script>
    console.log('🟢 Debug page loaded');
    alert('Debug script loaded');

    const supabase = supabase.createClient(
      'https://iwkdznjqfbsfkscnbrkc.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBh....QprkAbiU'
    );
    const form = document.getElementById('testForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorEl = document.getElementById('errorMsg');

    function generateReferralCode(len = 8) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      return Array.from({length: len}, () =>
        chars.charAt(Math.floor(Math.random()*chars.length))
      ).join('');
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      console.log('🖱️ Submit clicked');
      alert('Submit handler fired');

      errorEl.textContent = '';
      submitBtn.disabled = true;

      // Simple match check
      if (form.password.value !== form.confirm_password.value) {
        errorEl.textContent = "Passwords don't match";
        submitBtn.disabled = false;
        return;
      }

      try {
        console.log('1️⃣ Calling supabase.auth.signUp');
        const { data: authData, error: signErr } = await supabase.auth.signUp({
          email: form.email.value,
          password: form.password.value,
          options: { emailRedirectTo: window.location.href }
        });
        console.log('👉 signUp result', authData, signErr);
        if (signErr) throw signErr;
        const user = authData.user;
        alert('Auth signup succeeded: ' + user.id);

        // Photo upload
        let photoUrl = null;
        if (form.photo.files.length) {
          console.log('2️⃣ Uploading photo');
          const file = form.photo.files[0];
          const { data: upData, error: upErr } = await supabase.storage
            .from('profile-photos')
            .upload(`${user.id}/${file.name}`, file, { upsert: true });
          console.log('👉 upload result', upData, upErr);
          if (upErr) console.warn('Upload error', upErr);
          else photoUrl = upData.path;
        }

        // Lookup referral
        let refId = null;
        if (form.referral_code.value) {
          console.log('3️⃣ Checking referral code:', form.referral_code.value);
          const { data: ref, error: refErr } = await supabase
            .from('profiles')
            .select('id')
            .eq('referral_code', form.referral_code.value)
            .single();
          console.log('👉 referral lookup', ref, refErr);
          if (refErr && refErr.code !== 'PGRST116') throw refErr;
          if (ref) refId = ref.id;
        }

        // Call RPC
        const code = generateReferralCode();
        const link = `https://prudentproexchange.net/referral/${code}`;
        console.log('4️⃣ Calling RPC insert_profile_with_password');
        const { error: profErr } = await supabase.rpc('insert_profile_with_password', {
          p_id: user.id,
          p_email: form.email.value.toLowerCase(),
          p_first_name: form.first_name.value,
          p_last_name: form.last_name.value,
          p_username: form.username.value,
          p_country: form.country.value,
          p_referral_code: code,
          p_referral_link: link,
          p_photo_url: photoUrl,
          p_referred_by: refId,
          p_deposit_wallet: 0,
          p_total_deposits: 0,
          p_total_withdrawals: 0,
          p_total_invested: 0,
          p_promo_pct: 0,
          p_promo_offer: 0,
          p_referral_earnings: 0,
          p_status: 'active',
          p_password: form.password.value
        });
        console.log('👉 RPC result', profErr);
        if (profErr) throw profErr;
        alert('✅ RPC insert succeeded');
      } catch (err) {
        console.error('❌ Error in flow', err);
        errorEl.textContent = err.message || JSON.stringify(err);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
