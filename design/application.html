<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Test Apply • PrudentProExchange</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #f5f5f5; }
    form { max-width: 400px; margin: auto; background: #fff; padding: 1.5rem; border-radius: 8px; }
    label { display: block; margin-bottom: .75rem; }
    input, select { width: 100%; padding: .5rem; margin-top: .25rem; }
    button { margin-top: 1rem; padding: .75rem 1.5rem; }
    .error { color: red; margin-top: .5rem; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <h2>Test Sign-Up Form</h2>
  <form id="testForm">
    <label>
      First Name
      <input type="text" name="first_name" required />
    </label>
    <label>
      Last Name
      <input type="text" name="last_name" required />
    </label>
    <label>
      Email Address
      <input type="email" name="email" required />
    </label>
    <label>
      Username
      <input type="text" name="username" required />
    </label>
    <label>
      Select Country
      <select name="country" required>
        <option value="">-- choose --</option>
        <option value="GB">United Kingdom</option>
        <option value="US">United States</option>
        <option value="NG">Nigeria</option>
        <!-- add more as needed -->
      </select>
    </label>
    <label>
      Referral Code (optional)
      <input type="text" name="referral_code" />
    </label>
    <label>
      Password
      <input type="password" name="password" required />
    </label>
    <label>
      Confirm Password
      <input type="password" name="confirm_password" required />
    </label>
    <label>
      Profile Photo (optional)
      <input type="file" name="photo" accept="image/*" />
    </label>
    <button type="submit">Create Account</button>
    <p class="error" id="errorMsg"></p>
  </form>

  <script>
    // Initialize Supabase
    const supabase = supabase.createClient(
      'https://iwkdznjqfbsfkscnbrkc.supabase.co',
      'PUBLIC_ANON_KEY' // replace with your anon key
    );

    function generateReferralCode(len = 8) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      return Array.from({length: len}, () => chars.charAt(Math.floor(Math.random()*chars.length))).join('');
    }

    document.getElementById('testForm').addEventListener('submit', async e => {
      e.preventDefault();
      document.getElementById('errorMsg').textContent = '';
      const f = e.target;
      // basic validation
      if (f.password.value !== f.confirm_password.value) {
        return document.getElementById('errorMsg').textContent = "Passwords don't match.";
      }

      // 1) sign up
      const { data: authData, error: signErr } = await supabase.auth.signUp({
        email: f.email.value,
        password: f.password.value,
        options: { emailRedirectTo: window.location.href }
      });
      if (signErr) {
        console.error(signErr);
        return document.getElementById('errorMsg').textContent = signErr.message;
      }
      const user = authData.user;
      console.log('Auth user:', user);

      // 2) build profile payload
      const code = generateReferralCode();
      const link = `https://prudentproexchange.net/referral/${code}`;
      let photoUrl = null;
      if (f.photo.files[0]) {
        const file = f.photo.files[0];
        const { data: upData, error: upErr } = await supabase.storage
          .from('profile-photos')
          .upload(`${user.id}/${file.name}`, file, { upsert: true });
        if (upErr) console.warn('Upload err:', upErr);
        else photoUrl = upData.path;
      }
      // lookup referrer id
      let refId = null;
      if (f.referral_code.value) {
        const { data: ref, error: refErr } = await supabase
          .from('profiles')
          .select('id').eq('referral_code', f.referral_code.value)
          .single();
        if (ref && ref.id) refId = ref.id;
      }

      // 3) call RPC
      const { error: profErr } = await supabase.rpc('insert_profile_with_password', {
        p_id:               user.id,
        p_email:            f.email.value.toLowerCase(),
        p_first_name:       f.first_name.value,
        p_last_name:        f.last_name.value,
        p_username:         f.username.value,
        p_country:          f.country.value,
        p_referral_code:    code,
        p_referral_link:    link,
        p_photo_url:        photoUrl,
        p_referred_by:      refId,
        p_deposit_wallet:   0,
        p_total_deposits:   0,
        p_total_withdrawals:0,
        p_total_invested:   0,
        p_promo_pct:        0,
        p_promo_offer:      0,
        p_referral_earnings:0,
        p_status:           'active',
        p_password:         f.password.value
      });
      if (profErr) {
        console.error(profErr);
        document.getElementById('errorMsg').textContent = profErr.message;
      } else {
        alert('✅ Test account created!');
        console.log('Profile row should now exist.');
      }
    });
  </script>

</body>
</html>
