<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Test Apply • PrudentProExchange</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/login.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <style>
    .message {
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 4px;
      text-align: center;
      display: none;
      white-space: pre-wrap; /* Preserve newlines in error details */
    }
    .message.error {
      background-color: #f8d7da;
      color: #721c24;
    }
    .message.success {
      background-color: #d4edda;
      color: #155724;
    }
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    .cta.primary.loading {
      position: relative;
      opacity: 0.7;
      cursor: not-allowed;
    }
    .cta.primary.loading .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
    }
    .cta.primary .spinner {
      display: none;
    }
    @keyframes spin {
      to { transform: translateY(-50%) rotate(360deg); }
    }
    .gtranslate_wrapper {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
    }
    #back-to-top {
      position: fixed !important;
      bottom: 80px !important;
      right: 20px !important;
      z-index: 1000 !important;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 4px 10px var(--shadow);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #back-to-top:hover {
      background: var(--gold-dark);
      transform: scale(1.1);
    }
    .crisp-client .cc-unoo {
      background: var(--gold) !important;
      border-radius: 50% !important;
      box-shadow: 0 4px 10px var(--shadow) !important;
    }
    .crisp-client .cc-unoo:hover {
      background: var(--gold-dark) !important;
      transform: scale(1.1) !important;
    }
    .crisp-client .cc-conv {
      background: var(--glass-bg) !important;
      backdrop-filter: blur(10px) !important;
      border-radius: 15px !important;
      box-shadow: 0 4px 20px var(--shadow) !important;
      color: var(--text) !important;
    }
    @media (max-width: 768px) {
      .gtranslate_wrapper {
        bottom: 10px;
        left: 10px;
      }
      #back-to-top {
        bottom: 70px !important;
        right: 10px !important;
        width: 40px;
        height: 40px;
        font-size: 1.2rem;
      }
    }
    .form-grid {
      display: grid;
      gap: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
    }
    input, select {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }
  </style>
</head>
<body class="login-page">
  <!-- Video Background -->
  <video class="bg-video" autoplay muted loop playsinline preload="auto" poster="assets/images/video-poster.jpg">
    <source src="assets/videos/background.webm" type="video/webm">
    <source src="assets/videos/background.mp4" type="video/mp4">
  </video>
  <div class="overlay">
    <header class="site-header">
      <button id="theme-toggle" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>
      <a href="/" class="logo-link">
        <img src="assets/images/logo.svg" alt="PrudentProExchange Logo" class="logo"/>
      </a>
      <button class="hamburger" id="hamburgerApp" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-drawer" id="navDrawerApp">
        <a href="application.html" class="active">Apply</a>
        <a href="about.html">About</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms & Conditions</a>
        <a href="login.html">Login</a>
        <a href="plans.html">Investment Plans</a>
      </nav>
    </header>

    <main class="form-page container">
      <section class="section section-light" data-aos="fade-up">
        <p class="section-text">
          Sign up to start your investment journey with PrudentProExchange.
        </p>
        <div class="form-wrapper">
          <div id="message" class="message"></div>
          <form id="testForm" class="form-container" novalidate>
            <div class="form-grid">
              <label>
                First Name*
                <input type="text" name="first_name" required aria-label="First Name"/>
              </label>
              <label>
                Last Name*
                <input type="text" name="last_name" required aria-label="Last Name"/>
              </label>
              <label>
                Email Address*
                <input type="email" name="email" required aria-label="Email Address"/>
              </label>
              <label>
                Username*
                <input type="text" name="username" required aria-label="Username"/>
              </label>
              <label>
                Select Country*
                <select name="country" required aria-label="Select Country">
                  <option value="">-- choose --</option>
                  <option value="GB">United Kingdom</option>
                  <option value="US">United States</option>
                  <option value="NG">Nigeria</option>
                </select>
              </label>
              <label>
                Referral Code (optional)
                <input type="text" name="referral_code" aria-label="Referral Code"/>
              </label>
              <label>
                Password*
                <input type="password" name="password" required aria-label="Password"/>
              </label>
              <label>
                Confirm Password*
                <input type="password" name="confirm_password" required aria-label="Confirm Password"/>
              </label>
              <label>
                Profile Photo (optional)
                <input type="file" name="photo" accept="image/*" aria-label="Profile Photo"/>
              </label>
            </div>
            <button type="submit" class="cta primary" id="submitBtn"><span class="spinner"></span>Create Account</button>
            <p class="signup-link">Already have an account? <a href="login.html">Log In</a></p>
          </form>
        </div>
      </section>
    </main>
  </div>

  <!-- Back to Top Button -->
  <button id="back-to-top" aria-label="Back to top">🚀</button>

  <!-- GTranslate Widget -->
  <div class="gtranslate_wrapper"></div>
  <script>window.gtranslateSettings = {"default_language":"en","native_language_names":true,"detect_browser_language":true,"wrapper_selector":".gtranslate_wrapper","flag_style":"3d"}</script>
  <script src="https://cdn.gtranslate.net/widgets/latest/float.js" defer></script>

  <!-- Crisp Chat Widget -->
  <script type="text/javascript">
    window.$crisp = [];
    window.CRISP_WEBSITE_ID = "599e8216-ab4f-4d4f-bb22-5d47cf14031f";
    (function() {
      d = document;
      s = d.createElement("script");
      s.src = "https://client.crisp.chat/l.js";
      s.async = 1;
      d.getElementsByTagName("head")[0].appendChild(s);
    })();
  </script>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    // Initialize AOS animations
    AOS.init({ duration: 800, once: true });

    // Back to top
    document.getElementById('back-to-top').addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Global JS error + promise-rejection handlers
    window.addEventListener('error', e => {
      alert(`Error: ${e.message}\n(${e.filename}:${e.lineno})`);
    });
    window.addEventListener('unhandledrejection', e => {
      alert(`Unhandled rejection: ${e.reason}`);
    });

    // Initialize Supabase client
    const { createClient } = supabase;
    const supabaseClient = createClient(
      'https://iwkdznjqfbsfkscnbrkc.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3a2R6bmpxZmJzZmtzY25icmtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA2Mjk2ODgsImV4cCI6MjA2NjIwNTY4OH0.eRiXpUKP0zAMI9brPHFMxdSwZITGHxu8BPRQprkAbiU'
    );

    // Check for existing session and redirect if present
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        window.location.href = 'dashboard.html';
      }
    })();

    // Hamburger menu toggle
    const btnApp = document.getElementById('hamburgerApp'),
          drawerApp = document.getElementById('navDrawerApp');
    btnApp.addEventListener('click', () => {
      drawerApp.classList.toggle('open');
      btnApp.classList.toggle('active');
    });

    // Theme toggle
    const themeToggle = document.getElementById('theme-toggle');
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('light-theme');
      const icon = themeToggle.querySelector('i');
      icon.classList.toggle('fa-moon');
      icon.classList.toggle('fa-sun');
    });

    // Function to show modern messages
    function showMessage(text, isError = true) {
      const msgDiv = document.getElementById('message');
      msgDiv.textContent = text;
      msgDiv.className = `message ${isError ? 'error' : 'success'}`;
      msgDiv.style.display = 'block';
      // Auto-hide after 5 seconds
      setTimeout(() => {
        msgDiv.style.display = 'none';
      }, 5000);
    }

    function generateReferralCode(len = 8) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      return Array.from({length: len}, () => chars.charAt(Math.floor(Math.random()*chars.length))).join('');
    }

    // Hook up signup form
    document.getElementById('testForm').addEventListener('submit', async e => {
      e.preventDefault();
      e.stopPropagation();

      const f = e.target;
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.classList.add('loading');
      submitBtn.disabled = true;
      document.getElementById('message').style.display = 'none';

      // Basic validation
      if (f.password.value !== f.confirm_password.value) {
        showMessage('Validation Error: Passwords do not match');
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
        return;
      }

      try {
        // 1) Auth signup
        const { data: authData, error: signErr } = await supabaseClient.auth.signUp({
          email: f.email.value,
          password: f.password.value,
          options: { emailRedirectTo: window.location.href }
        });
        if (signErr) {
          console.error('❌ signUp error object:', signErr);
          // Display every field returned
          const details = [
            `message: ${signErr.message}`,
            `status:  ${signErr.status || '–'}`,
            `code:    ${signErr.code || '–'}`,
            `details: ${signErr.details || '–'}`
          ].join('\n');
          throw new Error(`Authentication Error:\n${details}`);
        }

        const user = authData.user;

        // 2) Photo upload
        let photoUrl = null;
        if (f.photo.files[0]) {
          const file = f.photo.files[0];
          const { data: upData, error: upErr } = await supabaseClient.storage
            .from('profile-photos')
            .upload(`${user.id}/${file.name}`, file, { upsert: true });
          if (upErr) throw new Error(`Photo Upload Error: ${upErr.message}`);
          photoUrl = upData.path;
        }

        // 3) Lookup referrer
        let refId = null;
        if (f.referral_code.value) {
          const { data: ref, error: refErr } = await supabaseClient
            .from('profiles')
            .select('id')
            .eq('referral_code', f.referral_code.value)
            .single();
          if (refErr && refErr.code !== 'PGRST116') throw new Error(`Referral Lookup Error: ${refErr.message}`);
          if (ref) refId = ref.id;
          else {
            showMessage('Invalid Referral Code: The provided referral code does not exist');
            submitBtn.classList.remove('loading');
            submitBtn.disabled = false;
            return;
          }
        }

        // 4) Prepare and call RPC
        const code = generateReferralCode();
        const link = `https://prudentproexchange.net/referral/${code}`;

        const { error: profErr } = await supabaseClient.rpc('insert_profile_with_password', {
          p_id: user.id,
          p_email: f.email.value.toLowerCase(),
          p_first_name: f.first_name.value,
          p_last_name: f.last_name.value,
          p_username: f.username.value,
          p_country: f.country.value,
          p_referral_code: code,
          p_referral_link: link,
          p_photo_url: photoUrl,
          p_referred_by: refId,
          p_deposit_wallet: 0,
          p_total_deposits: 0,
          p_total_withdrawals: 0,
          p_total_invested: 0,
          p_promo_pct: 0,
          p_promo_offer: 0,
          p_referral_earnings: 0,
          p_status: 'active',
          p_password: f.password.value
        });
        if (profErr) throw new Error(`Profile Creation Error: ${profErr.message}`);

        showMessage('Account Created Successfully! Please check your email to verify your account.', false);
        // Redirect to success page after 2 seconds
        setTimeout(() => {
          window.location.href = 'dashboard.html'; // Replace with your success page URL
        }, 2000);
      } catch (err) {
        showMessage(`Failed to Create Account:\n${err.message}`);
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
      }
    });

    // Video Playback Optimization
    document.addEventListener('DOMContentLoaded', () => {
      const video = document.querySelector('.bg-video');
      let retryCount = 0;
      const maxRetries = 3;
      const retryDelay = 1000;

      if (video) {
        const playVideo = () => {
          video.play()
            .then(() => {
              console.log('Background video is playing successfully');
              retryCount = 0;
            })
            .catch(error => {
              console.error(`Background video play failed (attempt ${retryCount + 1}):`, error);
              if (retryCount < maxRetries) {
                retryCount++;
                setTimeout(playVideo, retryDelay);
              } else {
                console.error('Max retries reached. Video playback failed.');
                showMessage('Failed to load background video. Please refresh the page.', true);
              }
            });
        };

        playVideo();

        video.addEventListener('canplay', () => console.log('Background video can play'));
        video.addEventListener('playing', () => console.log('Background video is actively playing'));
        video.addEventListener('error', (e) => {
          console.error('Background video error:', e);
          showMessage('Failed to load background video. Please refresh the page.', true);
        });
        video.addEventListener('stalled', () => console.warn('Background video stalled'));
        video.addEventListener('loadeddata', () => console.log('Background video data loaded'));

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            if (video.paused) {
              playVideo();
            }
          } else {
            video.pause();
            console.log('Background video paused due to tab inactivity');
          }
        });

        const forcePlayOnInteraction = () => {
          if (video.paused) {
            playVideo();
            console.log('Attempting to play background video on user interaction');
          }
        };

        window.addEventListener('scroll', forcePlayOnInteraction, { once: true });
        window.addEventListener('click', forcePlayOnInteraction, { once: true });
      } else {
        console.error('Background video element not found');
        showMessage('Background video element not found.', true);
      }
    });
  </script>
</body>
</html>
