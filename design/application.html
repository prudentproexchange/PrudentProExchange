<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Test Apply • PrudentProExchange</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #f0f2f5; }
    form { max-width: 400px; margin: auto; background: #fff; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);}
    label { display: block; margin-bottom: 1rem; }
    input, select { width: 100%; padding: .5rem; margin-top: .25rem; border: 1px solid #ccc; border-radius: 4px; }
    button { margin-top: 1rem; padding: .75rem 1.5rem; background: #0069d9; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #999; }
    .error { color: #b00020; margin-top: .5rem; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <h2 style="text-align:center;">PrudentProExchange Test Sign-Up</h2>
  <form id="testForm" novalidate>
    <label>
      First Name
      <input type="text" name="first_name" required />
    </label>
    <label>
      Last Name
      <input type="text" name="last_name" required />
    </label>
    <label>
      Email Address
      <input type="email" name="email" required />
    </label>
    <label>
      Username
      <input type="text" name="username" required />
    </label>
    <label>
      Select Country
      <select name="country" required>
        <option value="">-- choose --</option>
        <option value="GB">United Kingdom</option>
        <option value="US">United States</option>
        <option value="NG">Nigeria</option>
      </select>
    </label>
    <label>
      Referral Code (optional)
      <input type="text" name="referral_code" />
    </label>
    <label>
      Password
      <input type="password" name="password" required />
    </label>
    <label>
      Confirm Password
      <input type="password" name="confirm_password" required />
    </label>
    <label>
      Profile Photo (optional)
      <input type="file" name="photo" accept="image/*" />
    </label>
    <button type="submit" id="submitBtn">Create Account</button>
    <p class="error" id="errorMsg"></p>
  </form>

  <script>
    // Initialize Supabase
    const supabase = supabase.createClient(
      'https://iwkdznjqfbsfkscnbrkc.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3Znp6bmpxZmJzZmtzY25icmtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA2Mjk2ODgsImV4cCI6MjA2NjIwNTY4OH0.eRiXpUKP0zAMI9brPHFMxdSwZITGHxu8BPRQprkAbiU'
    );

    function generateReferralCode(len = 8) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      return Array.from({length: len}, () => chars.charAt(Math.floor(Math.random()*chars.length))).join('');
    }

    document.getElementById('testForm').addEventListener('submit', async e => {
      e.preventDefault();
      const f = e.target;
      const errorEl = document.getElementById('errorMsg');
      errorEl.textContent = '';
      document.getElementById('submitBtn').disabled = true;

      // Basic validation
      if (f.password.value !== f.confirm_password.value) {
        errorEl.textContent = "Passwords don't match.";
        document.getElementById('submitBtn').disabled = false;
        return;
      }

      try {
        // 1) Auth signup
        const { data: authData, error: signErr } = await supabase.auth.signUp({
          email: f.email.value,
          password: f.password.value,
          options: { emailRedirectTo: window.location.href }
        });
        if (signErr) throw signErr;
        const user = authData.user;

        // 2) Photo upload
        let photoUrl = null;
        if (f.photo.files[0]) {
          const file = f.photo.files[0];
          const { data: upData, error: upErr } = await supabase.storage
            .from('profile-photos')
            .upload(`${user.id}/${file.name}`, file, { upsert: true });
          if (upErr) console.warn('Upload error:', upErr);
          else photoUrl = upData.path;
        }

        // 3) Lookup referrer
        let refId = null;
        if (f.referral_code.value) {
          const { data: ref, error: refErr } = await supabase
            .from('profiles')
            .select('id')
            .eq('referral_code', f.referral_code.value)
            .single();
          if (refErr && refErr.code !== 'PGRST116') throw refErr;
          if (ref) refId = ref.id;
        }

        // 4) Prepare and call RPC
        const code = generateReferralCode();
        const link = `https://prudentproexchange.net/referral/${code}`;

        const { error: profErr } = await supabase.rpc('insert_profile_with_password', {
          p_id:                user.id,
          p_email:             f.email.value.toLowerCase(),
          p_first_name:        f.first_name.value,
          p_last_name:         f.last_name.value,
          p_username:          f.username.value,
          p_country:           f.country.value,
          p_referral_code:     code,
          p_referral_link:     link,
          p_photo_url:         photoUrl,
          p_referred_by:       refId,
          p_deposit_wallet:    0,
          p_total_deposits:    0,
          p_total_withdrawals: 0,
          p_total_invested:    0,
          p_promo_pct:         0,
          p_promo_offer:       0,
          p_referral_earnings: 0,
          p_status:            'active',
          p_password:          f.password.value
        });
        if (profErr) throw profErr;

        alert('✅ Test account created!');
      } catch (err) {
        console.error(err);
        errorEl.textContent = err.message || JSON.stringify(err);
      } finally {
        document.getElementById('submitBtn').disabled = false;
      }
    });
  </script>

</body>
</html>
