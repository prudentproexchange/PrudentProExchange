<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GTranslate Language Selector Demo</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #e0eafc, #cfdef3);
      height: 100vh;
      overflow-x: hidden;
    }

    header {
      padding: 20px;
      background-color: #0044cc;
      color: white;
      text-align: center;
    }

    .content {
      padding: 40px;
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
    }

    .content h1 {
      font-size: 36px;
      color: #0044cc;
    }

    .content p {
      font-size: 18px;
      color: #333;
      line-height: 1.6;
    }

    .gtranslate_wrapper {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 9999;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .gtranslate_wrapper select {
      border-radius: 8px;
      padding: 6px 12px;
      border: 1px solid #ccc;
      font-size: 14px;
      background: #fff;
      color: #333;
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to My Website</h1>
  </header>

  <div class="content">
    <h1>Hello World!</h1>
    <p>This is a beautiful multilingual website powered by GTranslate. Use the language selector at the bottom left to translate the page into your preferred language.</p>
  </div>

  <!-- GTranslate Widget -->
  <div class="gtranslate_wrapper"></div>
  <script>
    window.gtranslateSettings = {
      "default_language": "en",
      "native_language_names": true,
      "detect_browser_language": true,
      "wrapper_selector": ".gtranslate_wrapper",
      "flag_style": "3d"
    };
  </script>
  <script src="https://cdn.gtranslate.net/widgets/latest/float.js" defer></script>

  <!-- Crisp Chat Widget -->
  <script type="text/javascript">
    window.$crisp = [];
    window.CRISP_WEBSITE_ID = "599e8216-ab4f-4d4f-bb22-5d47cf14031f";
    (function() {
      d = document;
      s = d.createElement("script");
      s.src = "https://client.crisp.chat/l.js";
      s.async = 1;
      d.getElementsByTagName("head")[0].appendChild(s);
    })();
  </script>

</body>
</html>
